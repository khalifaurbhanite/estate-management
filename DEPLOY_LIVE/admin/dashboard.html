<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🏢 Estate Manager</h2>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="agents.html" class="nav-item">
                <span class="icon">👥</span> Agents
            </a>
            <a href="reports.html" class="nav-item">
                <span class="icon">📈</span> Reports
            </a>
            <a href="settings.html" class="nav-item">
                <span class="icon">⚙️</span> Settings
            </a>
            <hr>
            <a href="#" class="nav-item" onclick="logout(); return false;">
                <span class="icon">🚪</span> Logout
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1>Admin Dashboard</h1>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <span id="userName">Admin</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div id="alertBox" class="alert"></div>
            
            <div class="card">
                <h2>System Overview</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
                    <div style="background: #f0f4ff; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #667eea;" id="totalAgents">0</div>
                        <div style="color: #666; margin-top: 10px;">Total Agents</div>
                    </div>
                    <div style="background: #d4edda; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #28a745;" id="activeAgents">0</div>
                        <div style="color: #666; margin-top: 10px;">Active Agents</div>
                    </div>
                    <div style="background: #f8d7da; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 32px; font-weight: bold; color: #dc3545;" id="suspendedAgents">0</div>
                        <div style="color: #666; margin-top: 10px;">Suspended</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Recent Agents</h2>
                <div class="table-responsive">
                    <table id="agentsTable">
                        <thead>
                            <tr>
                                <th>Company Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4" style="text-align: center; color: #999;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkRole('SUPER_ADMIN');

        async function loadDashboard() {
            try {
                const data = await API.getAdminDashboard();
                
                document.getElementById('totalAgents').textContent = data.totalAgents || 0;
                document.getElementById('activeAgents').textContent = data.activeAgents || 0;
                document.getElementById('suspendedAgents').textContent = data.suspendedAgents || 0;

                const tbody = document.querySelector('#agentsTable tbody');
                if (data.agents && data.agents.length > 0) {
                    tbody.innerHTML = data.agents.map(agent => `
                        <tr>
                            <td>${agent.company_name}</td>
                            <td>${agent.email}</td>
                            <td>
                                <span class="badge ${agent.suspended_at ? 'badge-danger' : 'badge-success'}">
                                    ${agent.suspended_at ? 'Suspended' : 'Active'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm ${agent.suspended_at ? 'btn-success' : 'btn-danger'}" 
                                    onclick="toggleAgent('${agent.id}', ${!agent.suspended_at})">
                                    ${agent.suspended_at ? 'Activate' : 'Suspend'}
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No agents found</td></tr>';
                }
            } catch (error) {
                showAlert('Error loading dashboard: ' + error.message, 'danger');
            }
        }

        async function toggleAgent(agentId, suspend) {
            try {
                if (suspend) {
                    await API.suspendAgent(agentId, 'Suspended by admin');
                    showAlert('Agent suspended', 'warning');
                } else {
                    await API.activateAgent(agentId);
                    showAlert('Agent activated', 'success');
                }
                loadDashboard();
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
