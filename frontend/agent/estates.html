<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Estates - Estate Manager</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header"><h2>Estate Manager</h2></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
            <a href="estates.html" class="nav-item active"><span class="icon">🏢</span> Estates</a>
            <a href="courts.html" class="nav-item"><span class="icon">🏘️</span> Courts</a>
            <a href="blocks.html" class="nav-item"><span class="icon">🏗️</span> Blocks</a>
            <a href="houses.html" class="nav-item"><span class="icon">🏠</span> Houses</a>
            <a href="billing.html" class="nav-item"><span class="icon">💰</span> Billing</a>
            <a href="employees.html" class="nav-item"><span class="icon">👥</span> Employees</a>
            <hr>
            <a href="javascript:logout()" class="nav-item"><span class="icon">🚪</span> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1>Estates</h1>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <span id="userName">Agent</span>
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23667eea'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E" alt="User">
                </div>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Manage Estates</h2>
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Create Estate</button>
                </div>

                <div id="alertBox" class="alert"></div>

                <div class="table-responsive">
                    <table id="estatesTable">
                        <thead>
                            <tr>
                                <th>Estate Name</th>
                                <th>Location</th>
                                <th>Courts</th>
                                <th>Houses</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="estatesBody">
                            <tr><td colspan="6" style="text-align: center; padding: 20px;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Estate Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Estate</h2>
                <button class="modal-close" onclick="closeModal('createModal')">×</button>
            </div>
            <form id="createForm">
                <div class="form-group">
                    <label>Estate Name</label>
                    <input type="text" id="estateName" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="estateLocation">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="estateCity">
                    </div>
                    <div class="form-group">
                        <label>Postal Code</label>
                        <input type="text" id="estatePostalCode">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('createModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Estate</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkRole('AGENT');
            if (!user) return;
            document.getElementById('userName').textContent = user.email;
            loadEstates();
        });

        async function loadEstates() {
            try {
                const data = await API.getEstates();
                const tbody = document.getElementById('estatesBody');
                tbody.innerHTML = '';

                if (data.estates.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999; padding: 20px;">No estates yet</td></tr>';
                    return;
                }

                data.estates.forEach(estate => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${estate.name}</strong></td>
                        <td>${estate.location || 'N/A'}</td>
                        <td>${estate.court_count || 0}</td>
                        <td>${estate.house_count || 0}</td>
                        <td>${formatDate(estate.created_at)}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editEstate('${estate.id}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteEstate('${estate.id}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                showAlert('Error loading estates: ' + error.message, 'danger');
            }
        }

        function openCreateModal() {
            openModal('createModal');
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await API.createEstate({
                    name: document.getElementById('estateName').value,
                    location: document.getElementById('estateLocation').value,
                    city: document.getElementById('estateCity').value,
                    postalCode: document.getElementById('estatePostalCode').value
                });
                showAlert('Estate created successfully', 'success');
                closeModal('createModal');
                document.getElementById('createForm').reset();
                loadEstates();
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            }
        });

        async function deleteEstate(estateId) {
            if (!confirm('Delete this estate?')) return;
            try {
                await fetch(`/api/agent/estates/${estateId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                showAlert('Estate deleted', 'success');
                loadEstates();
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
