<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🏢 Estate Manager</h2>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="houses.html" class="nav-item">
                <span class="icon">🏠</span> My Houses
            </a>
            <a href="bills.html" class="nav-item">
                <span class="icon">💰</span> Bills
            </a>
            <a href="tasks.html" class="nav-item">
                <span class="icon">✅</span> Tasks
            </a>
            <hr>
            <a href="#" class="nav-item" onclick="logout(); return false;">
                <span class="icon">🚪</span> Logout
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1>My Dashboard</h1>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <span id="userName">Employee</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div id="alertBox" class="alert"></div>

            <div class="card">
                <h2>Welcome! 👋</h2>
                <p>View your assigned houses and manage daily tasks.</p>
            </div>

            <div class="card">
                <h2>Assigned Properties</h2>
                <div class="table-responsive">
                    <table id="housesTable">
                        <thead>
                            <tr>
                                <th>House Number</th>
                                <th>Estate</th>
                                <th>Tenant</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script>
        checkRole('EMPLOYEE');

        async function loadDashboard() {
            try {
                const data = await API.getEmployeeDashboard();
                const tbody = document.querySelector('#housesTable tbody');
                
                if (data.houses && data.houses.length > 0) {
                    tbody.innerHTML = data.houses.map(house => `
                        <tr>
                            <td>${house.house_number}</td>
                            <td>${house.estate_name}</td>
                            <td>${house.tenant_name || 'Unassigned'}</td>
                            <td><span class="badge badge-success">${house.status}</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No assigned houses</td></tr>';
                }
            } catch (error) {
                showAlert('Error loading dashboard: ' + error.message, 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
