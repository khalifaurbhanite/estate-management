<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estate Manager - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .login-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
        }

        .login-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo svg {
            width: 60px;
            height: 60px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }

            .login-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="30" width="20" height="50" fill="#667eea" rx="2"/>
                    <rect x="40" y="20" width="20" height="60" fill="#667eea" rx="2"/>
                    <rect x="70" y="35" width="20" height="45" fill="#667eea" rx="2"/>
                </svg>
            </div>

            <h1>Estate Manager</h1>
            <p class="subtitle">Professional Property Management Platform</p>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="you@example.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%; margin-bottom: 20px;">
                    Sign In
                </button>
            </form>

            <div style="text-align: center;">
                <a href="#forgot" style="font-size: 14px; margin-right: 15px;">Forgot Password?</a>
                <a href="#support" style="font-size: 14px;">Need Help?</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const response = await API.login(emailInput.value, passwordInput.value);

                localStorage.setItem('token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));

                showAlert('Login successful!', 'success');

                try {
                    const termsCheck = await API.checkTermsAcceptance(response.user.id);
                    
                    if (!termsCheck.accepted) {
                        setTimeout(() => {
                            window.location.href = '/terms-modal.html';
                        }, 500);
                    } else {
                        redirectByRole(response.user.role);
                    }
                } catch (error) {
                    redirectByRole(response.user.role);
                }
            } catch (error) {
                showAlert(error.message || 'Login failed', 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        function redirectByRole(role) {
            setTimeout(() => {
                if (role === 'SUPER_ADMIN') {
                    window.location.href = '/admin/dashboard.html';
                } else if (role === 'AGENT') {
                    window.location.href = '/agent/dashboard.html';
                } else if (role === 'EMPLOYEE') {
                    window.location.href = '/employee/dashboard.html';
                }
            }, 500);
        }
    </script>
</body>
</html>
