name = "estate-management-worker"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
main = "src/index.js"
site = { bucket = "./frontend" }
compatibility_date = "2024-12-01"

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# Database connection
[env.production]
vars = { SUPABASE_URL = "YOUR_SUPABASE_URL", SUPABASE_KEY = "YOUR_SUPABASE_KEY", JWT_SECRET = "YOUR_JWT_SECRET" }

[env.development]
vars = { SUPABASE_URL = "YOUR_SUPABASE_URL", SUPABASE_KEY = "YOUR_SUPABASE_KEY", JWT_SECRET = "YOUR_JWT_SECRET" }
